# Publishing to PyPI without a stored API token.
#
# PyPI mints a short-lived credential for this exact workflow in this exact
# repository, so there is no long-lived secret to leak and the release carries
# an attestation tying it to the commit it was built from. For a tool whose
# whole subject is supply-chain trust, publishing from a laptop with a token
# pasted into the shell is the wrong example to set.
#
# The publisher is registered on PyPI, so this now runs on its own when a
# release is published:
#
#   Owner: M1rwana12   Repository: ghostpkg
#   Workflow: publish.yml   Environment: pypi
#
# A manual run is still available for a tag that was released before this was
# wired up, or to retry one that failed after the release already existed.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish, e.g. v0.24.4
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A release event carries its own tag; a manual run names one.
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --quiet build twine
          python -m build
          python -m twine check dist/*

      - name: Check the tag matches the version in the package
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          version=$(python -c "import ghostpkg; print(ghostpkg.__version__)")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match __version__ $version"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The whole point: an OIDC token is exchanged with PyPI for a credential
      # scoped to this project, instead of a stored API token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
