name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: CLI smoke test
        run: |
          ghostpkg --version
          ghostpkg check requests

  # The action is a distributed artefact like any other, so it is exercised on
  # every push rather than only when someone reports it broken. It runs against
  # this repository's own manifests.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The checkout, not the published release: this job exists to catch a
      # broken action before it ships, and the released copy cannot contain a
      # fix that has not been released yet.
      - run: pip install -e .
      - uses: ./
        with:
          install: "false"
