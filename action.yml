name: ghostpkg
description: Catch package names that do not exist before you install them
author: m1rwana12

branding:
  icon: shield
  color: purple

inputs:
  paths:
    description: >-
      Manifests, lockfiles, or a directory to search, separated by whitespace or
      newlines. Defaults to the whole checkout, which finds every manifest while
      skipping node_modules, .venv and other vendored trees.
    required: false
    default: "."
  strict:
    description: >-
      Treat warnings as blocking. Off by default, and worth leaving off: a
      legitimate package published this week is indistinguishable from a
      slopsquat, so strict mode flags real dependencies too.
    required: false
    default: "false"
  deep:
    description: >-
      Download recently published packages and statically inspect their install
      scripts. Nothing is ever executed.
    required: false
    default: "false"
  version:
    description: >-
      Version of ghostpkg to install. Pin it for reproducible runs. The action
      needs 0.18.0 or newer, which is where --format github arrived.
    required: false
    default: ">=0.18.0"
  install:
    description: >-
      Install ghostpkg. Set to false when the job has already put it on PATH --
      because the project pins it itself, or to test a checkout.
    required: false
    default: "true"
  python-version:
    description: Python used to run ghostpkg, not the version your project targets.
    required: false
    default: "3.12"
  fail-on-error:
    description: >-
      Fail the job when a name could not be checked at all -- a registry
      timeout, say. On by default, because an unchecked name is not a pass.
    required: false
    default: "true"

outputs:
  exit-code:
    description: "0 clean, 1 something blocked, 2 something unchecked, 3 nothing found"
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Set up Python
      if: ${{ inputs.install == 'true' }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # Every input is passed through `env` rather than interpolated into the
    # script. `${{ }}` is substituted into the text of the step before bash
    # ever sees it, so an input containing a quote or a semicolon becomes part
    # of the command -- the classic Actions template injection. Through `env`
    # the value is data the shell reads, and metacharacters cannot escape.
    - name: Install ghostpkg
      if: ${{ inputs.install == 'true' }}
      shell: bash
      env:
        SPEC: ${{ inputs.version }}
      run: |
        case "$SPEC" in
          "")            python -m pip install --quiet "ghostpkg>=0.18.0" ;;
          [0-9]*)        python -m pip install --quiet "ghostpkg==$SPEC" ;;
          *)             python -m pip install --quiet "ghostpkg$SPEC" ;;
        esac

    - name: Report the version in use
      shell: bash
      run: ghostpkg --version

    - name: Scan
      id: scan
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        STRICT: ${{ inputs.strict }}
        DEEP: ${{ inputs.deep }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: |
        args=()
        [ "$STRICT" = "true" ] && args+=(--strict)
        [ "$DEEP" = "true" ] && args+=(--deep)

        # Split on whitespace, including newlines, so both `paths: a b` and a
        # multi-line list work. A path containing a space has to be passed on
        # its own; splitting is what makes several paths possible at all.
        paths=()
        while IFS= read -r item; do
          [ -n "$item" ] && paths+=("$item")
        done < <(printf '%s' "$PATHS" | tr -s ' \t\n' '\n')
        [ ${#paths[@]} -eq 0 ] && paths=(.)

        set +e
        ghostpkg scan "${paths[@]}" --format github "${args[@]}"
        code=$?
        set -e

        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

        # 3 means no manifest was found. That is not a pass, but in a workflow
        # that runs on every push it is also not a failure worth stopping for --
        # a docs-only repository would fail forever. It is reported and skipped.
        case "$code" in
          0) exit 0 ;;
          3) echo "::notice::ghostpkg found no manifests to check"; exit 0 ;;
          2) [ "$FAIL_ON_ERROR" = "true" ] && exit 2 || exit 0 ;;
          *) exit "$code" ;;
        esac
